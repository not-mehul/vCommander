[project]
name = "vcommander"
version = "3.5"
description = "Desktop tool to commission, populate and decommission Verkada Command orgs"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Errors, pyflakes, bugbear, pyupgrade and import order. Line length (E501)
# is left to review: the codebase isn't black-formatted.
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]

[tool.ruff.lint.isort]
known-first-party = ["apis", "components", "constants", "pages", "theme", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# flet announces API removals as "X is deprecated since version N" warnings;
# fail on them so CI flags the next removal before an upgrade breaks the app.
filterwarnings = ["error:.*is deprecated since version:DeprecationWarning"]
